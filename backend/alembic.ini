[alembic]
script_location = alembic
prepend_sys_path = .
# La URL real se inyecta desde el archivo .env a través de alembic/env.py
# No escribir credenciales aquí. Ver: backend/.env.example
sqlalchemy.url = postgresql://USER:PASSWORD@localhost:5432/BD_GRIN

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
